@if (files().length === 0) {
  <p id="no-files" class="empty">{{ 'clinicalExams.files.empty' | translate }}</p>
} @else {
  <ul id="clinical-files" class="files">
    @for (file of files(); track file.id) {
      <li class="file" [id]="'file-' + file.id">
        <span class="file-icon" [class]="'file-icon ' + file.type.toLowerCase()">
          <app-icon [name]="icons[file.type]" [size]="20" />
        </span>
        <span class="file-text">
          <strong>{{ file.fileName }}</strong>
          <small>{{ file.sizeInKilobytes }} KB · {{ file.uploadedAt | date: 'dd/MM/yyyy HH:mm' }}</small>
        </span>
        <button
          type="button"
          class="download"
          [id]="'download-file-' + file.id"
          [attr.aria-label]="'clinicalExams.files.download' | translate"
          [title]="'clinicalExams.files.download' | translate"
          (click)="downloadRequested.emit(file)"
        >
          <mat-icon>download</mat-icon>
        </button>
      </li>
    }
  </ul>
}

@if (canUpload()) {
  <input
    #fileInput
    id="file-input"
    class="hidden-input"
    type="file"
    [accept]="acceptedTypes"
    (change)="select(fileInput)"
  />
  <button
    id="upload-file-button"
    class="dropzone"
    type="button"
    [disabled]="saving()"
    (click)="fileInput.click()"
  >
    <span class="drop-icon"><app-icon name="upload" [size]="20" /></span>
    <span class="drop-text">
      <strong>{{ 'clinicalExams.files.upload' | translate }}</strong>
      <small>{{ 'clinicalExams.files.hint' | translate }}</small>
    </span>
  </button>
}
